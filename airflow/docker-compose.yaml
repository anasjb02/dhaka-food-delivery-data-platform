services:
  airflow:
    build: .
    command: ["airflow", "standalone"]
    ports:
      - "8082:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ..:/opt/project
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      OLLAMA_URL: "http://host.docker.internal:11434/api/chat"
      SAMPLE_N: "50"
